<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>收支比 × 鑑價 試算</title><style>
:root{--bg:#f3f5f8;--c:#fff;--t:#1d2733;--m:#69758a;--l:#dde3ea;--p:#1f5fbf;--pb:#e7f0fd;--ok:#127a4a;--okb:#e0f4ea;--w:#9a5a00;--wb:#fff0d6;--d:#b3261e;--db:#fde7e5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--c:#1a222b;--t:#e6ebf0;--m:#98a4b1;--l:#2d3944;--p:#6aa5ff;--pb:#1d2d45;--ok:#4cc38a;--okb:#16342a;--w:#f0b35a;--wb:#3a2d14;--d:#ff8a80;--db:#3d1d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161c;--c:#1a222b;--t:#e6ebf0;--m:#98a4b1;--l:#2d3944;--p:#6aa5ff;--pb:#1d2d45;--ok:#4cc38a;--okb:#16342a;--w:#f0b35a;--wb:#3a2d14;--d:#ff8a80;--db:#3d1d1b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--c);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--c);border-bottom:1px solid var(--l);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-size:16px;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}.act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:8px;padding:6px 11px;cursor:pointer}
nav button.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}.arm{background:var(--db);color:var(--d);border-color:var(--d)}
main{padding:12px 14px;max-width:1500px;margin:auto;display:grid;gap:12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px 14px}
h2{font-size:15px;margin:0 0 6px}h2 small{color:var(--m);font-weight:400;font-size:12px;margin-left:6px}h3{font-size:13px;margin:10px 0 2px;color:var(--p)}h4{margin:6px 0 0;font-size:13px}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;color:var(--m);font-size:13px}label>span{display:flex;align-items:center;gap:4px;width:58%}
input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);border-color:transparent}
label>select{width:58%}label>textarea{width:100%}label:has(textarea){display:block}label.ck{justify-content:flex-start;color:var(--t)}label.ck input{width:auto}
i{font-style:normal;color:var(--m);font-size:12px;white-space:nowrap}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.kpi div{background:var(--pb);border-radius:10px;padding:8px 10px}.kpi span{display:block;font-size:12px;color:var(--m)}.kpi b{font-size:18px}
.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(290px,1.1fr) minmax(280px,1fr);gap:12px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum{text-align:right;margin-top:6px;padding-top:6px;border-top:1px dashed var(--l)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--l);text-align:right}td:first-child,th:first-child{text-align:left;color:var(--m)}tr.tot td{font-weight:700;color:var(--p)}
.evg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.ev{border:1px solid var(--l);border-radius:10px;padding:6px 10px}.ev.me{border-color:var(--p);background:var(--pb)}
.res{font-size:12px;color:var(--ok);margin-top:4px}.res2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}.res2 div{border:1px solid var(--l);border-radius:10px;padding:8px 10px}.res2 span{display:block;font-size:12px;color:var(--m)}.res2 b{font-size:16px}
.w{padding:7px 12px;border-radius:8px;margin-bottom:6px;font-size:13px}.w.d{background:var(--db);color:var(--d)}.w.w{background:var(--wb);color:var(--w)}.w.ok{background:var(--okb);color:var(--ok)}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.tb button{padding:3px 8px;font-size:12px}.tb button.on{background:var(--pb);border-color:var(--p);color:var(--p)}
#rimg{width:100%;border-radius:8px;background:#fff}.note{color:var(--m);font-size:12px}.ov{overflow-x:auto}.ov th button{font-weight:600}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
@media print{header .act,nav,.noprint{display:none!important}body{background:#fff}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>

<div class=ev><h4>車位佐證</h4>${F('pk.l','屋齡/樓層',0,1)}${F('pk.a','面積','坪')}${F('pk.p','價格','萬')}${F('mech','機械佐證(文字)',0,1)}</div></div>
<div class=res2 id=ares></div><label>佐證說明（自動產生）<textarea id=desc readonly rows=6></textarea></label></section>`}
function paint(){const c=C(),R=calc(c),m=c.me;tabs();
 $('#oE').textContent=f(R.ex)+' 元';if($('#oP'))$('#oP').textContent=f(R.pay);$('#oI').textContent=f(R.mi)+' 元';
 $('#kpi').innerHTML=[['收支比',R.ex>0?f(R.r,1)+'%':'—'],['月收入',f(R.mi)],['月支出',f(R.ex)],['最高成數',f(R.mx,1)+'成'+(R.nst?'(築巢)':'')],['適用利率',f(R.rate,3)+'%'],['估價區間(仟/坪)',R.ks.length?R.lo+' – '+R.hi:'—'],['本案估價(仟)',f(R.est)],['放款值(仟)',f(R.loan)]].map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join('');
 $('#warn').innerHTML=(R.w.length?R.w:[['ok','各項檢核正常']]).map(([k,t])=>`<div class="w ${k}">${t}</div>`).join('');
 const d=x=>x?'-'+f(x,2):'—';
 $('#rt').innerHTML=`<table><tr><td>利率基礎</td><td>${f(R.base,3)}%</td></tr>${R.rows.map(([l,x])=>`<tr><td>${l}</td><td>${d(x)}</td></tr>`).join('')}${c.prod=='C'?'':`<tr><td>減碼後</td><td>${f(R.raw,3)}%</td></tr><tr><td>利率底線(${c.use=='購置'?'購屋':'增貸'})</td><td>${f(R.floor,3)}%</td></tr>`}<tr class=tot><td>適用利率</td><td>${f(R.rate,3)}%</td></tr></table>`;
 R.ev.forEach((x,j)=>{const e=$('#ev'+j);if(e)e.textContent=x.u?`建物 ${f(x.ba,2)}坪／${f(x.bp)}萬 → 單坪 ${f(x.u,2)}萬 = ${x.k}仟`:''});
 $('#ares').innerHTML=[['估價區間(仟/坪)',R.ks.length?R.lo+' – '+R.hi:'—'],['本案單價位置',R.pos||'—'],['本案總面積',f(m.a+m.pa,2)+' 坪'],['本案估價',f(R.est)+' 仟 ／ '+f(R.est/10,1)+' 萬'],['購價',R.buy?f(R.buy)+' 仟':'—'],['放款值',f(R.loan)+' 仟 ／ '+f(R.loan/10,1)+' 萬']].map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join('');
 const nn='一二三四';$('#desc').value=[...c.ev.slice(0,c.n).map((e,j)=>`佐證${nn[j]}：${e.l}(${f(e.pa,2)}坪)  ${f(e.pp)}萬`),`車位佐證：${c.pk.l}(${f(c.pk.a,2)}坪)  ${f(c.pk.p)}萬`,`機械佐證：${c.mech}`,`本案物件：${m.l}(${f(m.pa,2)}坪) ${f(m.pp)}萬`].join('\n');
}
function over(){const R=S.cases.map(calc),L=[['案件／客戶',(c)=>c.name||'—'],['日期',c=>c.date],['用途／房產',c=>c.use+'／名下'+c.own],['產品類別',pname],['月收入',(c,r)=>f(r.mi)],['月支出',(c,r)=>f(r.ex)],['收支比',(c,r)=>r.ex>0?f(r.r,1)+'%':'—'],['最高成數',(c,r)=>f(r.mx,1)+'成'],['申貸成數',c=>f(c.ltv*10,1)+'成'],['適用利率',(c,r)=>f(r.rate,3)+'%'],['預計貸款(萬)／年期',c=>c.amt?f(c.amt)+'／'+c.yr+'年':'—'],['本次新案期金(元)',(c,r)=>f(r.pay||c.e[0])],['佐證數',c=>c.n],['估價區間(仟/坪)',(c,r)=>r.ks.length?r.lo+' – '+r.hi:'—'],['本案單價(仟/坪)',c=>f(c.me.u)],['單價位置',(c,r)=>r.pos||'—'],['本案估價(仟)',(c,r)=>f(r.est)],['購價(仟)',(c,r)=>r.buy?f(r.buy):'—'],['放款值(仟)',(c,r)=>f(r.loan)],['放款值(萬)',(c,r)=>f(r.loan/10,1)],['狀態',(c,r)=>`<span class="w ${r.st[0]}">${r.st[1]}${r.w.length?'：'+r.w.map(x=>x[1]).join('；'):''}</span>`]];
 return`<section class="card ov"><h2>一覽總表<small>收入／利率／鑑價 · 點案件名稱切換</small></h2><table><tr><th></th>${S.cases.map((c,i)=>`<th><button data-go=${i}>案件${AB[i]}</button></th>`).join('')}</tr>${L.map(([l,fn])=>`<tr><td>${l}</td>${S.cases.map((c,i)=>`<td>${fn(c,R[i])}</td>`).join('')}</tr>`).join('')}</table></section>`}
function tabs(){$('#tabs').innerHTML=[0,1,2].map(i=>`<button data-tab=${i} class="${S.cur==i?'on':''}">案件${AB[i]}${S.cases[i].name?'・'+esc(S.cases[i].name):''}</button>`).join('')+`<button data-tab=3 class="${S.cur==3?'on':''}">一覽總表</button>`}
function img(){const e=$('#rimg');if(e)e.src=IM[ri];document.querySelectorAll('[data-ri]').forEach(b=>b.classList.toggle('on',+b.dataset.ri==ri))}
function render(){tabs();$('#clr').hidden=S.cur==3;if(S.cur==3){$('#app').innerHTML=over();return}$('#app').innerHTML=view();img();paint()}
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;set(k,t.type=='checkbox'?(t.checked?1:0):t.value);const c=C();if(c.prod=='C'&&c.cls>1)c.cls=0;save();['prod','use','n'].includes(k)?render():paint()});
const arm=(t,l,fn)=>{if(t._a){clearTimeout(t._a);t._a=0;t.textContent=t._o;t.classList.remove('arm');fn();return}t._o=t.textContent;t.textContent=l;t.classList.add('arm');t._a=setTimeout(()=>{t._a=0;t.textContent=t._o;t.classList.remove('arm')},3000)};
async function exp(){document.querySelectorAll('input,textarea,select').forEach(x=>{if(x.tagName=='TEXTAREA')x.textContent=x.value;else if(x.tagName=='SELECT')[...x.options].forEach(o=>o.toggleAttribute('selected',o.selected));else if(x.type=='checkbox')x.toggleAttribute('checked',x.checked);else x.setAttribute('value',x.value)});
 const d=document.documentElement.cloneNode(true);d.querySelectorAll('script,.noexp').forEach(x=>x.remove());const h='<!doctype html>'+d.outerHTML,c=C(),fn=`收支比鑑價_${S.cur==3?'一覽總表':'案件'+AB[S.cur]+(c.name?'_'+c.name:'')}_${(c.date||'').replace(/\//g,'')}.html`;
 try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data:h});return}}catch(e){if(e&&e.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=fn;a.click()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab!=null||d.go!=null){S.cur=+(d.tab??d.go);save();render()}else if(d.ri!=null){ri=+d.ri;img()}
 else if(d.act=='clr')arm(t,'再按一次確認',()=>{S.cases[S.cur]=E();save();render()});
 else if(d.act=='clrall')arm(t,'再按一次確認',()=>{S.cases=[E(),E(),E()];save();render()});
 else if(d.act=='exp')exp();else if(d.act=='prt')try{print()}catch(x){}});
render();
</script></body></html>
